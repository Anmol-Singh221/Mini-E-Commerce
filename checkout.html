
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ShopX</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .checkout-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .checkout-box {
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fff;
            color: #222;
        }

        .checkout-box h2 {
            margin-bottom: 20px;
        }

        .checkout-box input,
        .checkout-box textarea {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: inherit;
        }

        .checkout-product {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .checkout-product img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
        }

        .checkout-product-info {
            flex: 1;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .quantity-controls button {
            padding: 4px 10px;
            cursor: pointer;
        }

        .checkout-total {
            margin: 20px 0;
            font-size: 20px;
            font-weight: bold;
        }

        .place-order-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .place-order-btn:hover {
            background: #444;
        }


        .empty-cart {
            text-align: center;
            padding: 30px 0;
        }

        .success-message {
            padding: 20px;
            border-radius: 10px;
            background: #e8f8ed;
            color: #176534;
            line-height: 1.8;
        }

        @media (max-width: 700px) {
            .checkout-container {
                grid-template-columns: 1fr;
                margin: 20px auto;
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="checkout-container">

        <section class="checkout-box">
            <h2>Your Cart 🛒</h2>

            <div id="cart-items"></div>

            <div class="checkout-total">
                Total: $<span id="cart-total">0.00</span>
            </div>

            <a href="shop.html">← Continue Shopping</a>
        </section>

        <section class="checkout-box">
            <h2>Checkout Details</h2>

            <form id="checkout-form">
                <label for="customer-name">Full Name</label>
                <input
                    type="text"
                    id="customer-name"
                    required
                    minlength="2"
                    placeholder="Enter your full name">

                <label for="customer-email">Email Address</label>
                <input
                    type="email"
                    id="customer-email"
                    required
                    placeholder="Enter your email">

                <label for="customer-phone">Phone Number</label>
                <input
                    type="tel"
                    id="customer-phone"
                    required
                    pattern="[0-9]{10}"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="10-digit phone number">

                <label for="customer-address">Delivery Address</label>
                <textarea
                    id="customer-address"
                    required
                    minlength="10"
                    rows="4"
                    placeholder="Enter your delivery address"></textarea>

                <button class="place-order-btn" type="submit">
                    Place Order Now!
                </button>
            </form>

            <p style="font-size: 12px; color: #666; margin-top: 12px;">
                Demo only: no real order or payment will be processed.
            </p>

            <div id="order-result" aria-live="polite"></div>
        </section>

    </div>

    <script src="checkout.js"></script>
</body>
</html>
